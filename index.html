<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhun Disc Library</title>
<meta name="description" content="Browse the Dhun disc library by year, genre and language.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one screen. Top bar (logo, genre slider, language), curved 3D shelf of disc
     cases, then the focused album with now-playing and count, year timeline along the bottom.
     Opening an album wipes to a full-screen album page with a docked player. */
  --paper:#e8e9e7;
  --paper-deep:#d9dbd9;
  --ink:#14161a;
  --muted:#73777e;
  --line:#bfc2c3;
  --signal:#ef4423;
  --font-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gutter:clamp(16px,2.8vw,36px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.16em;font-size:11px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}

/* ───────── shell ───────── */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  background:radial-gradient(120% 85% at 50% 36%,#f3f3f1 0%,var(--paper) 52%,var(--paper-deep) 100%)}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,640px) minmax(0,1fr);grid-template-areas:"brand genre lang";align-items:center;column-gap:clamp(24px,4vw,64px);padding:22px var(--gutter) 8px}
.brand{grid-area:brand;display:flex;align-items:center;min-width:0}
.brand .logo{height:26px;width:auto;display:block}
.rule{display:inline-block;width:34px;height:1px;background:currentColor;opacity:.35;flex:none}
.platter{grid-column:1;justify-self:start;display:flex;align-items:center;gap:10px;min-width:0;max-width:100%}
.platter button{display:flex;align-items:center;gap:12px;min-width:0}
.pl-toggle{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);justify-content:center;flex:none}
.pl-toggle svg{width:14px;height:14px}
.pl-toggle:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pl-open .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);flex:none}
.platter.playing .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.pl-open .lab{color:var(--muted);white-space:nowrap}
.pl-open #plText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.focus{grid-column:2}
.count{grid-column:3;justify-self:end;color:var(--muted);white-space:nowrap}

/* ───────── 3D shelf ───────── */
.stage{position:relative;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.dragging{cursor:grabbing}
.floor-shadow{position:absolute;left:50%;bottom:0;width:130%;height:26%;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(50% 60% at 50% 0%,rgba(20,22,26,.16),rgba(20,22,26,0) 70%)}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.plank{position:absolute;left:0;top:-420px;height:420px;transform-origin:50% 100%;backface-visibility:hidden;
  background:linear-gradient(to top,#f7f7f5 0%,#e9eae8 24%,rgba(214,216,216,.75) 55%,rgba(205,207,208,0) 100%)}
.lip{position:absolute;left:0;top:0;height:20px;backface-visibility:hidden;
  background:
    linear-gradient(90deg,#2f3236 0 9px,transparent 9px) calc(var(--shift,0px) + var(--o,0px)) 5px/16px 3px repeat-x,
    linear-gradient(90deg,#2f3236 0 9px,transparent 9px) calc(var(--shift,0px) + var(--o,0px) + 8px) 11px/16px 3px repeat-x,
    linear-gradient(#fbfbfa 0%,#d2d4d4 45%,#9da0a1 100%)}
.case{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;cursor:pointer}
.f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;opacity:var(--o,1)}
.f::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.front{left:-150px;top:-150px;width:300px;height:300px;transform:translateZ(23px);--cw:300px}
.front::after{opacity:var(--shF,0)}
.back{left:-150px;top:-150px;width:300px;height:300px;transform:rotateY(180deg) translateZ(23px);
  background:color-mix(in oklab,var(--bg) 86%,#000);color:var(--ink);padding:26px 24px}
.back::after{opacity:var(--shB,0)}
.back ol{list-style:none;padding:0;display:grid;gap:7px;font:400 8.5px/1.2 var(--font-mono);letter-spacing:.06em;opacity:.85}
.back li{display:flex;justify-content:space-between;gap:12px}
.back li span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back .bc{position:absolute;right:22px;bottom:22px;width:54px;height:36px;background:#fff;padding:5px 6px}
.back .bc i{display:block;height:100%;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 3px,#111 3px 4px,#fff 4px 7px,#111 7px 10px,#fff 10px 11px)}
.back .bl{position:absolute;left:24px;bottom:24px;font:500 8px var(--font-mono);letter-spacing:.14em;opacity:.8}
.spine{left:-23px;top:-150px;width:46px;height:300px;transform:rotateY(-90deg) translateZ(150px);
  background:var(--bg);color:var(--ink);writing-mode:vertical-rl;display:flex;align-items:center;gap:10px;padding:14px 0 12px;white-space:nowrap}
.spine::after{opacity:var(--shS,0)}
.spine::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.16))}
.sp-cat{font:500 8px var(--font-mono);letter-spacing:.12em;opacity:.7;flex:none}
.sp-title{font:700 14.5px var(--font-body);letter-spacing:-.005em;flex:none}
.sp-artist{font:500 10.5px var(--font-body);opacity:.78;flex:0 1 auto;min-height:0;overflow:hidden;text-overflow:ellipsis}
.sp-dot{margin-inline-start:auto;flex:none;width:11px;height:11px;border-radius:50%;border:3px solid currentColor;opacity:.9}
.edge{left:-23px;top:-150px;width:46px;height:300px;transform:rotateY(90deg) translateZ(150px);
  background:linear-gradient(90deg,color-mix(in oklab,var(--bg) 62%,#000),color-mix(in oklab,var(--bg) 78%,#000) 42%,#111 48% 52%,color-mix(in oklab,var(--bg) 78%,#000) 58%,color-mix(in oklab,var(--bg) 62%,#000))}
.topf{left:-150px;top:-23px;width:300px;height:46px;transform:rotateX(90deg) translateZ(150px);background:color-mix(in oklab,var(--bg) 84%,#fff)}
.case.opening .edge{display:none}
.sdisc{position:absolute;left:-138px;top:-138px;width:276px;height:276px}

/* cover: shared by shelf cases and the album page */
.cover{background-color:var(--bg);background-size:cover;color:var(--ink);font-size:calc(var(--cw) / 30)}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,0) 34%);pointer-events:none}
.c-head{position:absolute;left:1.6em;right:1.6em;top:1.45em;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:1em;row-gap:.2em;align-items:baseline}
.c-artist{font-size:1.15em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cat{font:500 .82em var(--font-mono);letter-spacing:.1em}
.c-title{grid-column:1/-1;font:700 2em/1.12 var(--font-display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-title.long{font-size:1.55em;line-height:1.4}
.c-foot{position:absolute;left:1.6em;right:1.6em;bottom:0;height:4.2em;display:flex;align-items:center;justify-content:space-between}
.c-foot span{font:500 .82em var(--font-mono);letter-spacing:.14em;display:flex;align-items:center;gap:.7em}
.c-foot i{width:1.1em;height:1.1em;border-radius:50%;border:.34em solid currentColor}

/* disc */
.disc{position:relative;width:100%;height:100%;border-radius:50%;
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 12.2%,rgba(0,0,0,.62) 12.7% 27.4%,#000 27.9%);
  mask:radial-gradient(circle closest-side,transparent 0 12.2%,rgba(0,0,0,.62) 12.7% 27.4%,#000 27.9%)}
.disc-print{position:absolute;inset:0;border-radius:50%;overflow:hidden;will-change:transform}
.disc-print svg{display:block;width:100%;height:100%}
.disc-fx{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    conic-gradient(from 18deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.5) 20deg,rgba(255,214,246,.26) 34deg,rgba(255,255,255,0) 58deg,rgba(255,255,255,0) 176deg,rgba(255,255,255,.42) 198deg,rgba(204,243,255,.24) 214deg,rgba(255,255,255,0) 240deg,rgba(255,255,255,0) 360deg),
    repeating-radial-gradient(circle closest-side,rgba(0,0,0,.05) 0 .5%,transparent .5% 1.5%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6),inset 0 0 0 3px rgba(0,0,0,.1)}
.disc-hub{position:absolute;left:31%;top:31%;width:38%;height:38%;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle closest-side,transparent 0 50%,rgba(110,118,128,.55) 51% 53%,transparent 54%),
    radial-gradient(circle closest-side,rgba(236,239,242,.95) 0 72%,rgba(120,128,138,.7) 73% 74.5%,transparent 75.5%),
    conic-gradient(from 40deg,#f1f3f5,#b4b9c1,#fafbfc,#c2c7cf,#ffe6f5,#d2f2ff,#aeb4bc,#f1f3f5)}

.cursor-disc{position:absolute;left:0;top:0;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;pointer-events:none;z-index:5;
  background:radial-gradient(circle closest-side,var(--paper) 0 9%,#17191d 10% 34%,#2a2d32 35% 36%,#17191d 37%);
  color:#fff;display:grid;place-items:center;font:500 9px var(--font-mono);letter-spacing:.18em;
  opacity:0;scale:.4;transition:opacity .18s,scale .25s cubic-bezier(.2,.9,.3,1.3)}
.cursor-disc span{background:var(--signal);border-radius:50%;width:44%;height:44%;display:grid;place-items:center;padding-left:.18em}
.cursor-disc.on{opacity:1;scale:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}

/* ───────── control deck ───────── */
.deck{padding:6px var(--gutter) 18px;display:grid;gap:18px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:28px}
.lab{color:var(--muted);display:block}
.genre{grid-area:genre;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:26px;width:100%;max-width:640px;justify-self:center}
.genre .lab{line-height:22px}
.g-wrap{position:relative;height:44px}
.g-wrap input{position:absolute;left:0;top:0;width:100%;z-index:2}
.g-stops{position:absolute;left:9px;right:9px;top:0;height:100%}
.g-stop{position:absolute;top:0;height:100%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:11px;color:var(--muted)}
.g-stop i{width:5px;height:5px;border-radius:50%;background:var(--line);outline:3px solid var(--paper)}
.g-stop span{font:500 9.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding:2px 3px;position:relative;z-index:3}
.g-stop.on{color:var(--ink)}
.g-stop.on span{font-weight:500;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.g-stop:hover{color:var(--ink)}
.short{display:none}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0;
  --rng-fill:var(--ink);--rng-track:var(--line)}
.rng::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(to right,var(--rng-fill) var(--p,0%),var(--rng-track) var(--p,0%))}
.rng::-moz-range-track{height:2px;border-radius:2px;background:var(--rng-track)}
.rng::-moz-range-progress{height:2px;border-radius:2px;background:var(--rng-fill)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--rng-fill);margin-top:-6px;border:0}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--rng-fill);border:0}
.rng:focus-visible{outline:2px solid var(--signal);outline-offset:5px;border-radius:8px}
#genre::-webkit-slider-thumb{width:18px;height:18px;margin-top:-8px;box-shadow:0 0 0 4px var(--paper)}
#genre::-moz-range-thumb{width:18px;height:18px;box-shadow:0 0 0 4px var(--paper)}

.focus{display:grid;grid-template-columns:48px minmax(0,270px) 48px;gap:22px;align-items:center;text-align:center}
.nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .15s,color .15s,border-color .15s}
.nav svg{width:18px;height:18px}
.nav:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.nav:disabled{opacity:.3;cursor:default}
.f-text{display:grid;gap:5px;justify-items:center;min-width:0}
.f-kicker{color:var(--muted);display:flex;align-items:center;gap:9px;white-space:nowrap}
.f-kicker i{width:6px;height:6px;border-radius:50%;background:var(--signal)}
.f-title{font:600 21px/1.15 var(--font-display);letter-spacing:-.01em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid transparent}
.f-title:hover{border-bottom-color:currentColor}
.f-sub{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.f-text.swap>*{animation:swap .32s cubic-bezier(.2,.8,.2,1) both}
.f-text.swap>:nth-child(2){animation-delay:.03s}
.f-text.swap>:nth-child(3){animation-delay:.06s}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}

.lang{grid-area:lang;justify-self:end}
.select{position:relative}
.select select{-webkit-appearance:none;appearance:none;font:500 14px var(--font-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 40px 10px 18px;cursor:pointer;min-width:190px}
.select select:hover{border-color:var(--ink)}
.select::after{content:"";position:absolute;right:18px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}

.timeline{position:relative;height:72px;cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:6px}
.timeline canvas{position:absolute;left:0;top:0;width:100%;height:38px;display:block}
.pin{position:absolute;top:-8px;width:2px;height:46px;margin-left:-1px;background:var(--signal);pointer-events:none}
.pin::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--signal)}
.pin b{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-8px);font:500 11px var(--font-mono);letter-spacing:.08em;background:var(--ink);color:var(--paper);padding:4px 7px;border-radius:4px;opacity:0;transition:opacity .15s}
.timeline.scrub .pin b{opacity:1}
.years{position:absolute;left:0;right:0;top:46px;height:22px}
.years span{position:absolute;top:0;transform:translateX(-50%);font:400 12.5px var(--font-mono);letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.years span.on{color:var(--ink);font-weight:500}

/* ───────── album page ───────── */
.detail{position:fixed;inset:0;z-index:20;visibility:hidden;clip-path:circle(0px at 50% 50%);
  --tint:color-mix(in oklab,var(--d) 13%,#fbfbf8);--dink:color-mix(in oklab,var(--d) 62%,#0b0d10);
  background:var(--tint);color:var(--dink);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.detail.on{visibility:visible}
.detail:focus{outline:none}
.detail::before{content:"";position:absolute;inset:0;z-index:30;background:var(--bg);opacity:0;pointer-events:none}
.detail.wipe::before{animation:flash .7s ease-out both}
@keyframes flash{0%,25%{opacity:1}100%{opacity:0}}
.d-num{position:absolute;right:-2%;bottom:-8%;font:800 clamp(190px,33vw,520px)/.8 var(--font-display);letter-spacing:-.04em;color:color-mix(in oklab,var(--d) 6.5%,transparent);pointer-events:none;z-index:0;white-space:nowrap}
.d-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px var(--gutter) 0}
.back-btn{font:500 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;padding:13px 20px;border:1px solid color-mix(in oklab,var(--dink) 24%,transparent);border-radius:999px;white-space:nowrap}
.back-btn:hover{background:var(--dink);color:var(--tint)}
.d-brand{display:flex;align-items:center;gap:12px;color:color-mix(in oklab,var(--dink) 60%,transparent);white-space:nowrap}
.d-brand b{font-weight:500;color:var(--dink)}
.d-body{position:relative;z-index:1;overflow-y:auto;padding:16px var(--gutter) 22px clamp(16px,6.5vw,84px);
  display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(20px,4vw,56px);align-items:center}
.d-text{display:grid;gap:10px;align-content:center;min-width:0;max-width:600px}
.d-kicker{display:flex;align-items:center;gap:9px;color:color-mix(in oklab,var(--dink) 62%,transparent)}
.d-kicker i{width:6px;height:6px;border-radius:50%;background:var(--d)}
.d-artist{font-size:18px;font-weight:500;margin-top:6px}
.d-title{font:700 clamp(38px,5.6vw,84px)/.98 var(--font-display);letter-spacing:-.03em;text-wrap:balance;overflow:hidden;padding-bottom:.08em}
.d-title span{display:block}
.d-meta{color:color-mix(in oklab,var(--dink) 62%,transparent);margin-top:2px}
.d-blurb{font-size:17px;line-height:1.5;max-width:52ch;margin-top:4px}
.d-tracks{list-style:none;padding:0;margin-top:10px;border-top:1px solid color-mix(in oklab,var(--dink) 14%,transparent)}
.d-tracks li{border-bottom:1px solid color-mix(in oklab,var(--dink) 14%,transparent)}
.trk{width:100%;display:grid;grid-template-columns:28px 16px minmax(0,1fr) auto;align-items:center;gap:8px;padding:11px 4px;text-align:left;border-radius:4px}
.trk:hover{background:color-mix(in oklab,var(--d) 7%,transparent)}
.t-no,.t-dur{font:400 11px var(--font-mono);letter-spacing:.1em;color:color-mix(in oklab,var(--dink) 55%,transparent);font-variant-numeric:tabular-nums}
.t-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-eq{display:flex;align-items:flex-end;gap:2px;height:12px;visibility:hidden}
.t-eq i{width:3px;height:100%;background:var(--d);transform-origin:50% 100%;animation:eq .7s ease-in-out infinite alternate;animation-play-state:paused}
.t-eq i:nth-child(2){animation-duration:.5s;animation-delay:-.2s}
.t-eq i:nth-child(3){animation-duration:.9s;animation-delay:-.4s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.trk.on .t-eq{visibility:visible}
.trk.on .t-name{font-weight:600}
.detail.playing .trk.on .t-eq i{animation-play-state:running}

.d-hero{display:grid;place-items:center;perspective:1500px;--cw:clamp(200px,min(29vw,48vh),420px);min-height:calc(var(--cw) * 1.2);position:relative}
.hero-box{position:relative;width:var(--cw);height:var(--cw);transform-style:preserve-3d;
  transform:translateX(-25%) rotateY(-42deg) rotateX(4deg) scale(.82);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.detail.reveal .hero-box{transform:translateX(-25%) rotateY(-15deg) rotateX(3deg)}
.hero-box .cover{position:absolute;inset:0;overflow:hidden;transform:translateZ(calc(var(--cw) * .07));box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.hero-back{position:absolute;inset:0;background:color-mix(in oklab,var(--bg) 62%,#000);transform:translateZ(calc(var(--cw) * -.07))}
.hero-edge{position:absolute;left:100%;top:0;width:calc(var(--cw) * .07);height:100%;transform-origin:0 50%;transform:translateZ(calc(var(--cw) * .07)) rotateY(90deg);
  background:linear-gradient(90deg,color-mix(in oklab,var(--bg) 74%,#000),color-mix(in oklab,var(--bg) 56%,#000))}
.hero-disc{position:absolute;left:4%;top:4%;width:92%;height:92%;transform:translateX(0);transition:transform 1.1s cubic-bezier(.25,.9,.25,1) .25s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.detail.reveal .hero-disc{transform:translateX(50%)}
.hero-shadow{position:absolute;left:50%;top:calc(50% + var(--cw) * .56);width:calc(var(--cw) * 1.5);height:calc(var(--cw) * .16);transform:translateX(-62%);
  background:radial-gradient(50% 50% at 50% 50%,color-mix(in oklab,var(--d) 34%,transparent),transparent 72%);filter:blur(8px);pointer-events:none}

.rv{opacity:0;transform:translateY(16px)}
.detail.reveal .rv{opacity:1;transform:none;transition:opacity .5s ease,transform .75s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0) * 55ms + 140ms)}
.d-title span{transform:translateY(108%)}
.detail.reveal .d-title span{transform:none;transition:transform .9s cubic-bezier(.2,.8,.2,1) .22s}

.player{position:relative;z-index:2;display:grid;grid-template-columns:auto minmax(110px,230px) minmax(0,1fr) auto;align-items:center;gap:clamp(14px,2.4vw,32px);
  padding:12px var(--gutter);border-top:1px solid color-mix(in oklab,var(--dink) 14%,transparent);background:color-mix(in oklab,var(--tint) 72%,#fff);
  --rng-fill:var(--d);--rng-track:color-mix(in oklab,var(--dink) 20%,transparent)}
.player .rng{--rng-fill:var(--d);--rng-track:color-mix(in oklab,var(--dink) 20%,transparent)}
.p-transport{display:flex;align-items:center;gap:8px}
.p-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.p-btn svg{width:20px;height:20px}
.p-btn:hover{background:color-mix(in oklab,var(--d) 10%,transparent)}
.p-play{width:52px;height:52px;background:var(--d);color:#fff}
.p-play:hover{background:var(--dink)}
.p-play svg{width:24px;height:24px}
.p-now{display:grid;gap:3px;min-width:0}
.p-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-sub{font-size:10px;color:color-mix(in oklab,var(--dink) 58%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-seek{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.p-seek span{font:400 11px var(--font-mono);letter-spacing:.08em;font-variant-numeric:tabular-nums;min-width:36px}
.p-seek span:last-child{text-align:right}
.p-vol{display:flex;align-items:center;gap:6px}
.p-vol .rng{width:96px}
.p-note{grid-column:1/-1;font-size:10px;letter-spacing:.12em;color:color-mix(in oklab,var(--dink) 52%,transparent);margin-top:-4px}

/* ───────── narrower screens ───────── */
@media (max-width:1100px){
  .top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand lang" "genre genre";row-gap:18px}
  .genre{max-width:none}
  .years span.minor{display:none}
  .pl-open .lab{display:none}
}
@media (max-width:760px){
  .top{padding-top:16px;row-gap:14px}
  .brand .logo{height:22px}
  .genre{grid-template-columns:minmax(0,1fr);gap:6px}
  .genre .lab{line-height:1.2}
  .select select{min-width:158px;padding:9px 36px 9px 16px}
  .deck{gap:14px;padding-bottom:10px}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
  .focus{grid-column:1/-1;grid-row:1;grid-template-columns:42px minmax(0,1fr) 42px;gap:12px;width:100%}
  .platter{grid-column:1;grid-row:2}
  .count{grid-column:2;grid-row:2}
  .nav{width:42px;height:42px}
  .long{display:none}.short{display:inline}
  .timeline{height:64px}
  .d-body{grid-template-columns:minmax(0,1fr);padding:10px var(--gutter) 20px;align-items:start;gap:8px}
  .d-hero{order:-1;--cw:clamp(150px,min(50vw,26vh),300px);min-height:calc(var(--cw) * 1.16)}
  .d-brand span:first-child,.d-brand .rule{display:none}
  .d-blurb{font-size:15.5px}
  .player{grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;padding:10px var(--gutter)}
  .p-seek{grid-column:1/-1;grid-row:2}
  .p-vol .rng{display:none}
  .p-note{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

const BLURB={
Ambient:[["Tape loops left running overnight in an empty swimming hall.","Built from field recordings of a harbour before the ferries start.","Two synthesisers and a window left open to the rain.","Recorded in single takes between midnight and first light.","Assembled from a year of voice memos and one detuned piano."],
  ["Every piece arrives slowly and leaves the same way.","Nothing here hurries, and the low end stays warm throughout.","The melodies are small enough to miss on a first listen.","It sits behind a room the way weather sits behind a window.","Best played quietly, start to finish, without skipping."]],
Jazz:[["Cut live to two-track in a basement club after closing.","A small-group date with no charts, counted in and left alone.","Recorded over two evenings with the tape rolling between songs.","Originals written on a borrowed upright piano.","Brushes, a walking bass and an electric piano that is slightly out of tune."],
  ["The rhythm section never rushes, and the solos stay short.","You can hear chairs, glasses and the bassist counting off.","The ballads carry the record; the fast ones keep it honest.","It swings hardest when it plays quietest.","The second half is where the band stops being polite."]],
Electronic:[["Sequenced on a drum machine with three working pads.","Written on night buses and finished in a rented studio in four days.","A club record built from one synth, one sampler and a lot of patience.","Every track started as a loop that refused to end.","Hardware only, recorded straight to stereo with no edits."],
  ["The kick stays put while everything else drifts around it.","Arpeggios open up bar by bar until the room is full.","It works at low volume and gets better loud.","The bass lines do most of the talking.","Made for the last hour of the night, when the lights are low."]],
Rock:[["Tracked in a week in a garage with the door open.","Four people, two amplifiers and a drum kit held together with tape.","Written on tour and recorded the day the van came home.","Recorded loud in a rehearsal room the band was about to lose.","Ten days, one microphone on the room and no click track."],
  ["The choruses land early and the guitars never clean up.","Every song sounds one take away from falling apart.","The rhythm guitar is the lead instrument here.","It opens at full volume and only steps back once.","Short songs, long feedback, no ballad."]],
Folk:[["Recorded in a kitchen with one guitar and a borrowed microphone.","Songs collected over three harvests and sung in the order they were written.","Fingerpicked in open tuning, with the room left in the recording.","Made on a porch across one dry week in late summer.","Two voices, six strings and a floor that creaks in time."],
  ["The songs are plain on purpose and stay with you for it.","You hear every finger slide and every breath before a verse.","Nothing is doubled, nothing is fixed.","It sounds like a letter read aloud.","The quiet songs are the ones that carry furthest."]],
Pop:[["Written in a bedroom and finished in a proper studio with a proper budget.","Every hook was tested on friends before anyone pressed record.","Bright keys, handclaps and a bass line you can hum.","Made over one summer with the windows open.","A singles collection that happens to be a debut album."],
  ["Every chorus arrives before the first minute is out.","It is sweeter than it needs to be and knows it.","The verses are short so the hooks can come back sooner.","Three minutes a song, no filler between them.","Built for car stereos with the volume near the top."]]
};

/* cover art: programmatic SVG, one of eleven motifs, 300 x 192 art window */
const MOTIFS=[
 (r,[g,a,b,c])=>{const cx=150+(r()-.5)*70,cy=96+r()*18,R=58+r()*20;let s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${a}"/>`;
   for(let i=0;i<6;i++)s+=`<rect x="0" y="${cy+6+i*13}" width="300" height="${2.5+i*1.7}" fill="${g}"/>`;
   s+=`<rect x="0" y="150" width="300" height="42" fill="${c}"/>`;for(let i=0;i<4;i++)s+=`<rect x="${20+r()*150}" y="${158+i*9}" width="${40+r()*90}" height="2" fill="${g}" opacity=".7"/>`;
   return s+`<circle cx="${40+r()*220}" cy="${22+r()*20}" r="5" fill="${b}"/>`},
 (r,[g,a,b,c])=>{let s="";for(let i=0;i<26;i++)s+=`<circle cx="${r()*300}" cy="${r()*192}" r="${.6+r()*1.2}" fill="${b}" opacity=".7"/>`;
   s+=`<g transform="rotate(${-18+r()*12} 150 96)">`;[[66,20],[102,33],[140,46]].forEach(([rx,ry],i)=>{s+=`<ellipse cx="150" cy="96" rx="${rx}" ry="${ry}" fill="none" stroke="${b}" stroke-width="1.4" stroke-dasharray="2 5" opacity=".9"/>`;
     const th=r()*6.28;s+=`<rect x="${150+rx*Math.cos(th)-7}" y="${96+ry*Math.sin(th)-4}" width="14" height="8" rx="1.5" fill="${i%2?c:a}"/>`});
   return s+`</g><circle cx="150" cy="96" r="${26+r()*8}" fill="${a}"/>`},
 (r,[g,a,b,c])=>{const cx=50+r()*200,cy=40+r()*112;let s="";for(let i=10;i>=1;i--)s+=`<circle cx="${cx}" cy="${cy}" r="${i*21}" fill="none" stroke="${i%3===0?a:b}" stroke-width="${i%2?1.6:5}" opacity="${i%3===0?1:.55}"/>`;
   return s+`<circle cx="${cx}" cy="${cy}" r="9" fill="${c}"/>`},
 (r,[g,a,b,c])=>{let s=`<circle cx="${200+r()*60}" cy="${40+r()*18}" r="${17+r()*7}" fill="${b}"/>`;const cols=[a,a,a,c],op=[.3,.55,.85,1];
   for(let L=0;L<4;L++){const base=80+L*27,amp=20-L*3,f1=.012+r()*.02,p1=r()*6,f2=.04+r()*.03,p2=r()*6;let d=`M0,192 L0,${base}`;
     for(let x=0;x<=300;x+=6)d+=` L${x},${(base+amp*Math.sin(x*f1+p1)+amp*.35*Math.sin(x*f2+p2)).toFixed(1)}`;s+=`<path d="${d} L300,192 Z" fill="${cols[L]}" opacity="${op[L]}"/>`}
   return s},
 (r,[g,a,b,c])=>{let s="";const cs=[a,b,c];for(let y=0;y<4;y++)for(let x=0;x<6;x++){const cx=25+x*50,cy=24+y*48,col=cs[Math.floor(r()*3)];
     if(r()<.3)s+=`<circle cx="${cx}" cy="${cy}" r="15" fill="none" stroke="${col}" stroke-width="5"/>`;else{s+=`<circle cx="${cx}" cy="${cy}" r="18" fill="${col}"/>`;if(r()<.55)s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${g}"/>`}}
   return s},
 (r,[g,a,b,c])=>{let s=`<circle cx="${40+r()*220}" cy="${34+r()*14}" r="15" fill="${a}"/>`,x=-6;while(x<300){const w=20+r()*26,h=46+r()*104,dark=r()<.6;
     s+=`<rect x="${x}" y="${192-h}" width="${w}" height="${h}" fill="${dark?c:b}" opacity="${dark?1:.85}"/>`;
     for(let wy=192-h+8;wy<184;wy+=11)for(let wx=x+5;wx<x+w-6;wx+=8)if(r()<.34)s+=`<rect x="${wx}" y="${wy}" width="3.4" height="5" fill="${a}"/>`;x+=w+2}
   return s},
 (r,[g,a,b,c])=>{let s="";const cs=[a,b,c];for(let y=0;y<4;y++)for(let x=0;x<7;x++){const k=Math.floor(r()*4),dx=k&1?1:-1,dy=k&2?1:-1,cx=x*48+(dx>0?0:48),cy=y*48+(dy>0?0:48);
     s+=`<path d="M${cx},${cy} L${cx+dx*48},${cy} A48,48 0 0 ${dx*dy>0?1:0} ${cx},${cy+dy*48} Z" fill="${cs[Math.floor(r()*3)]}"/>`}
   return s},

     s+=`<rect x="${x}" y="${174-h}" width="8" height="${h}" rx="4" fill="${i%5===2?b:a}"/>`}

     s+=`<path d="M150,196 L${150+420*Math.cos(t1)},${196-420*Math.sin(t1)} L${150+420*Math.cos(t2)},${196-420*Math.sin(t2)} Z" fill="${a}" opacity=".9"/>`}
   return s+`<circle cx="150" cy="196" r="${48+r()*16}" fill="${c}"/><circle cx="150" cy="196" r="22" fill="${b}"/>`},
 (r,[g,a,b,c])=>{const cols=[a,b,c,a,b];let s="";for(let L=0;L<5;L++){const base=26+L*34,amp=9+r()*8,f=.02+r()*.025,p=r()*6;let d=`M0,192 L0,${base}`;
     for(let x=0;x<=300;x+=6)d+=` L${x},${(base+amp*Math.sin(x*f+p)).toFixed(1)}`;s+=`<path d="${d} L300,192 Z" fill="${cols[L]}" opacity="${L%2?.9:.75}"/>`}
   return s},
 (r,[g,a,b,c])=>{const fx=60+r()*180,fy=40+r()*110;let s=`<circle cx="${300-fx}" cy="${192-fy}" r="34" fill="${b}" opacity=".8"/>`;
   for(let y=0;y<10;y++)for(let x=0;x<16;x++){const cx=9.5+x*18.8,cy=9.6+y*19.2,dd=Math.hypot(cx-fx,cy-fy),rad=1+8*Math.max(0,1-dd/190);s+=`<circle cx="${cx}" cy="${cy}" r="${rad.toFixed(1)}" fill="${a}"/>`}

];
function coverSVG(al){
  const P=al.pal,art=MOTIFS[al.motif](rng32(al.seed^0x51ed),P.art);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="${P.bg}"/><svg x="0" y="66" width="300" height="192" viewBox="0 0 300 192"><rect width="300" height="192" fill="${P.art[0]}"/>${art}</svg></svg>`;
}

/* build the 120 albums */
const ALL=(()=>{
  const out=[];
  LANGS.forEach(([lc,ln])=>GENRES.forEach((g,gi)=>RAW[lc][gi].forEach(([title,artist])=>out.push({title,artist,lang:lc,langName:ln,genre:g,gi}))));
  const r=rng32(20261117);
  for(let i=out.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  const perYear=out.length/SPAN, gk={};
  out.forEach((al,i)=>{
    al.year=Y0+Math.floor(i/perYear); al.t=al.year+((i%perYear)+.5)/perYear;
    al.id="a"+i; al.cat="DHN-"+String(i+1).padStart(3,"0"); al.seed=hashStr(al.title+al.artist);
    al.pal=PALS[(i*5+(i>>3))%PALS.length]; al.motif=(al.seed>>>3)%MOTIFS.length;
    const rr=rng32(al.seed),pool=TRACKS[al.lang].slice(),n=5+Math.floor(rr()*3),[d0,d1]=DUR[al.genre];
    al.tracks=[];
    for(let k=0;k<n;k++){const name=pool.splice(Math.floor(rr()*pool.length),1)[0];al.tracks.push({name,sec:Math.round(lerp(d0,d1,rr()))})}
    if(rr()<.55&&al.title.length<22)al.tracks[Math.floor(rr()*n)].name=al.title;
    al.mins=Math.round(al.tracks.reduce((s,t)=>s+t.sec,0)/60);
    const k=gk[al.genre]=(gk[al.genre]??-1)+1,[A,B]=BLURB[al.genre];
    al.blurb=A[k%5]+" "+B[(k+Math.floor(k/5))%5];
    al.coverUrl=`url('data:image/svg+xml,${encodeURIComponent(coverSVG(al)).replace(/'/g,"%27")}')`;
    const {bg,art}=al.pal; al.accent=[art[1],art[2],art[3]].find(c=>c.toLowerCase()!==bg.toLowerCase());
  });
  return out;
})();
const byId=new Map(ALL.map(a=>[a.id,a]));

<div class="c-foot"><span><i></i>DHUN</span><span>${al.year}</span></div>`;

/* ───────── shelf geometry ───────── */
const W=300,H=300,T=46,R=1150,STEP=50,PUSH=W/2+40,FAN=24,PULL=72,PERSP=1500,CAMH=430,OUT=112,OPEN_PUSH=215;
let S=1,stageW=0,stageH=0,visN=18;
let list=ALL.slice(),cur=0,tgt=0,focusId=null,openAmt=0,openTween=null,dirty=true;
const items=new Map();

function buildShelf(){
  const seg=2.5,rO=R+OUT,w=2*rO*Math.tan(seg/2*RAD);let i=0;
  for(let a=-77.5;a<=77.51;a+=seg,i++){
    const p=document.createElement("div");p.className="plank";p.style.cssText=`width:${w+1.2}px;margin-left:${-(w+1.2)/2}px;transform:rotateY(${a}deg) translateZ(${rO}px) rotateX(90deg)`;
    const l=document.createElement("div");l.className="lip";l.style.cssText=`width:${w+1.2}px;margin-left:${-(w+1.2)/2}px;transform:rotateY(${a}deg) translateZ(${rO}px);--o:${(-(i*w)%16).toFixed(2)}px`;
    world.append(p,l);
  }
}
function makeCase(al){
  const el=document.createElement("div");el.className="case";el.dataset.id=al.id;el.style.display="none";
  el.style.setProperty("--bg",al.pal.bg);el.style.setProperty("--ink",al.pal.ink);
  el.innerHTML=`<div class="f front cover" style="background-image:${al.coverUrl}">${coverText(al)}</div>
<div class="f back"><ol>${al.tracks.map((t,i)=>`<li><span>${String(i+1).padStart(2,"0")} ${esc(t.name)}</span><span>${fmt(t.sec)}</span></li>`).join("")}</ol><span class="bl">${al.cat} · ${al.year}</span><div class="bc"><i></i></div></div>
<div class="f spine"><span class="sp-cat">${al.cat}</span><span class="sp-title">${esc(al.title)}</span><span class="sp-artist">${esc(al.artist)}</span><i class="sp-dot"></i></div>
<div class="f edge"></div><div class="f topf"></div>`;
  world.appendChild(el);
  return {al,el,pos:0,target:0,alpha:0,alphaT:1,shown:false};
}
function layout(){
  const r=stage.getBoundingClientRect();stageW=r.width;stageH=r.height;
  S=clamp(Math.min(stageH/452,stageW*.84/330),.28,1.6);
  const floorY=stageH-66*S-Math.max(0,stageH-452*S)*.5;
  stage.style.perspective=(PERSP*S)+"px";
  stage.style.perspectiveOrigin=`50% ${floorY-CAMH*S}px`;
  world.style.transform=`translate3d(${stageW/2}px,${floorY}px,0) scale3d(${S},${S},${S}) translateZ(${-R}px)`;
  visN=Math.min(Math.ceil((stageW/2/S+320)/STEP),Math.floor((72*RAD*R-PUSH)/STEP));
  dirty=true;drawTicks();
}
function render(){
  for(const it of items.values()){
    const d=it.pos-cur,ad=Math.abs(d);
    if(ad>visN+1||it.alpha<.004){if(it.shown){it.el.style.display="none";it.shown=false}continue}
    const sg=d<0?-1:1,fe=smooth(clamp(1-ad,0,1)),near=smooth(Math.min(ad,1));
    let s=d*STEP+sg*PUSH*near;
    if(d>0)s+=openAmt*OPEN_PUSH*near;
    const th=s/R*DEG;
    if(Math.abs(th)>76){if(it.shown){it.el.style.display="none";it.shown=false}continue}
    const fk=d>0?1-openAmt*.9:1,fan=FAN*fk*smooth(clamp((3.4-ad)/2.4,0,1));
    const a=ad<1?(90+sg*FAN*fk)*(1-fe):90+sg*fan;
    const st=it.el.style;

  if(spinV>.3){spin=(spin+spinV*dt)%360;
    const hp=dEl.disc.firstElementChild&&dEl.disc.firstElementChild.firstElementChild;if(hp&&detailOpen)hp.style.transform=`rotate(${spin.toFixed(2)}deg)`;
    if(sdisc&&(!detailOpen||busy)){const sp=sdisc.firstElementChild.firstElementChild;sp.style.transform=`rotate(${spin.toFixed(2)}deg)`}}
  if(detailOpen)tickPlayer();
  /* cursor disc */
  const show=mouse.over&&!detailOpen&&!busy;
  if(show){const r=stage.getBoundingClientRect();mouse.cx+=(mouse.x-r.left-mouse.cx)*.25;mouse.cy+=(mouse.y-r.top-mouse.cy)*.25;cursorDisc.style.transform=`translate(${mouse.cx.toFixed(1)}px,${mouse.cy.toFixed(1)}px)`}
  if(show!==cursorDisc.classList.contains("on")){if(show){const r=stage.getBoundingClientRect();mouse.cx=mouse.x-r.left;mouse.cy=mouse.y-r.top}cursorDisc.classList.toggle("on",show)}
  requestAnimationFrame(frame);
}

/* ───────── boot ───────── */
buildShelf();buildYears();layout();
applyFilter(true);
cur=tgt=clamp(34,0,list.length-1);
syncPlayer();render();checkFocus();updatePin();
new ResizeObserver(()=>{layout();applyBins()}).observe(stage);
function applyBins(){const nb=SPAN*(tl.clientWidth<560?3:6);if(nb!==bins){bins=nb;binCount=new Array(bins).fill(0);list.forEach(a=>{binCount[clamp(Math.floor((a.t-Y0)/SPAN*bins),0,bins-1)]++});drawTicks()}}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true});
requestAnimationFrame(frame);
})();
</script>
